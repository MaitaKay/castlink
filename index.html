<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castlink</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#12263a;--mute:#5b6d7f;--line:#d5dde6;--acc:#2450d6;--accfg:#fff;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a26;--card:#17283a;--ink:#e8eef5;--mute:#9db0c3;--line:#2a3f55;--acc:#8fb0ff;--accfg:#0f1a26;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 96px)}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}
h1{font-size:1.9rem;letter-spacing:-.02em;margin:0;font-weight:700}
google-cast-launcher{width:40px;height:40px;--connected-color:var(--acc);--disconnected-color:var(--ink);cursor:pointer}
.lead{color:var(--mute);margin:0 0 20px;max-width:46ch}
label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;background:var(--acc);color:var(--accfg);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.lang{width:84px;flex:none;text-align:center}
.status{min-height:1.5em;margin:12px 0;color:var(--mute)}
.status.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card[hidden],#bar[hidden]{display:none}
.card h2{font-size:1.1rem;margin:0 0 10px}
video{width:100%;border-radius:10px;background:#000;max-height:260px;margin-bottom:12px}
.card .row>*{flex:1}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
#bar .in{max-width:640px;margin:0 auto;display:grid;gap:10px}
#bar .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrub{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--mute)}
.scrub input{flex:1;height:28px}
.ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr 1fr;gap:8px}
.ctl button{padding:12px 6px}
#pp{font-size:1.05rem}
#bar .v{display:flex;gap:10px;align-items:center;color:var(--mute)}
#bar .v input{flex:1}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Castlink</h1>
    <google-cast-launcher aria-label="Choose a Chromecast"></google-cast-launcher>
  </header>
  <p class="lead">Paste a video link, pick a Chromecast with the button above, and play it on your TV.</p>

  <label for="url">Video link</label>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="https://… .mp4, .m3u8 or a jw.org video link" autocomplete="off">
    <input id="lang" class="lang" value="E" maxlength="4" aria-label="jw.org language code" title="jw.org language code (E = English)">
  </div>
  <div class="row" style="margin-top:8px"><button id="go">Find video</button></div>
  <div id="status" class="status" role="status"></div>

  <section id="result" class="card" hidden>
    <h2 id="title"></h2>
    <video id="prev" controls playsinline preload="metadata"></video>
    <label for="q">Quality</label>
    <div class="row" style="margin-bottom:12px"><select id="q"></select></div>
    <div class="row"><button id="cast">Cast to TV</button></div>
  </section>

  <p><small>Works in Chrome on Android, Windows, Mac and Linux, over HTTPS or localhost. Protected streams (Netflix, Disney+ and similar) can’t be cast this way.</small></p>
</main>

<div id="bar" hidden>
  <div class="in">
    <div class="t" id="bt"></div>
    <div class="scrub"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="back" class="alt" aria-label="Back 10 seconds">−10s</button>
      <button id="pp" aria-label="Play or pause">Pause</button>
      <button id="fwd" class="alt" aria-label="Forward 10 seconds">+10s</button>
      <button id="stop" class="alt">Stop</button>
    </div>
    <div class="v"><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const MIME={mp4:'video/mp4',m4v:'video/mp4',mov:'video/mp4',webm:'video/webm',m3u8:'application/x-mpegURL',mpd:'application/dash+xml',mp3:'audio/mpeg',m4a:'audio/mp4'};
const MEDIA_RE=/\.(mp4|m4v|mov|webm|m3u8|mpd|mp3|m4a)(?=[?#]|$)/i;
let current=null, player=null, ctrl=null, sdk=false, sdkChecked=false;

function setStatus(msg,err){const s=$('#status');s.textContent=msg||'';s.className='status'+(err?' err':'')}

/* ---------- Resolvers ---------- */
const mimeOf=u=>MIME[(u.match(MEDIA_RE)||[])[1]?.toLowerCase()]||'video/mp4';

async function resolveDirect(u){
  const name=decodeURIComponent(u.split('?')[0].split('/').pop()||'Video');
  return {title:name,files:[{label:'Original',url:u,mime:mimeOf(u)}]};
}

async function resolveJw(raw,lang){
  const txt=decodeURIComponent(raw);
  const lank=(txt.match(/\b(?:pub|docid)-[\w-]+_VIDEO\b/)||[])[0];
  if(!lank) return null;
  const loc=(txt.match(/[?&]wtlocale=([A-Za-z-]+)/)||[])[1];
  const code=(loc||lang||'E').toUpperCase();
  const r=await fetch(`https://b.jw-cdn.org/apis/mediator/v1/media-items/${code}/${lank}?clientType=www`);
  if(!r.ok) throw new Error(`jw.org returned ${r.status}. Check the language code (E = English).`);
  const m=(await r.json()).media?.[0];
  const files=(m?.files||[]).filter(f=>f.progressiveDownloadURL&&/mp4/.test(f.mimetype||'')).map(f=>({
    label:(f.label||f.frameHeight+'p')+(f.subtitled?' (subtitled)':''),
    h:f.frameHeight||parseInt(f.label)||0,url:f.progressiveDownloadURL,mime:'video/mp4'
  })).sort((a,b)=>b.h-a.h);
  if(!files.length) throw new Error('No playable files found for that video.');
  return {title:m.title||lank,files,thumb:m.images?.wss?.md||m.images?.lss?.md};
}

async function resolveGeneric(u){
  const r=await fetch(u);
  const html=await r.text();
  const found=(html.match(/https?:[^"'\s<>\\]+?\.(?:m3u8|mp4)(?:\?[^"'\s<>\\]*)?/gi)||[]);
  if(!found.length) return null;
  const uniq=[...new Set(found.map(x=>x.replace(/\\u0026/g,'&')))];
  const title=(html.match(/<title>([^<]*)/i)||[])[1]?.trim()||'Video';
  return {title,files:uniq.map((x,i)=>({label:`Stream ${i+1}`,url:x,mime:mimeOf(x)}))};
}

async function resolve(input,lang){
  if(MEDIA_RE.test(input)) return resolveDirect(input);
  if(/jw\.org|jw-cdn\.org/i.test(input)){
    const jw=await resolveJw(input,lang);
    if(jw) return jw;
  }
  return resolveGeneric(input);
}

/* ---------- UI ---------- */
$('#go').onclick=async()=>{
  const u=$('#url').value.trim();
  if(!/^https?:\/\//i.test(u)){setStatus('Enter a full link starting with http:// or https://',true);return}
  $('#result').hidden=true; setStatus('Looking for the video…'); $('#go').disabled=true;
  try{
    const res=await resolve(u,$('#lang').value.trim()||'E');
    if(!res){setStatus('No video found on that page. Paste a direct .mp4 or .m3u8 link instead.',true);return}
    current=res;
    $('#title').textContent=res.title;
    $('#q').innerHTML=res.files.map((f,i)=>`<option value="${i}">${f.label}</option>`).join('');
    const pick=res.files.findIndex(f=>/720|480/.test(f.label)); if(pick>0) $('#q').value=pick;
    setPreview(); $('#result').hidden=false; setStatus('Ready. Choose a Chromecast, then tap Cast to TV.');
  }catch(e){
    setStatus((e.name==='TypeError'?'The browser blocked that request (the site doesn’t allow it). Paste a direct .mp4 or .m3u8 link instead.':e.message),true);
  }finally{$('#go').disabled=false}
};
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#q').onchange=setPreview;
function chosen(){return current.files[+$('#q').value]}
function setPreview(){const v=$('#prev');v.poster=current.thumb||'';v.src=chosen().url}

/* ---------- Cast ---------- */
const canRemote=()=>!!($('#prev').remote);
window.__onGCastApiAvailable=ok=>{
  sdkChecked=true;
  if(!ok){
    setStatus(canRemote()?'Using your browser’s built-in casting. Find a video, then tap Cast to TV.':'Casting isn’t available in this browser. Use Chrome on Android or desktop.',!canRemote());
    return;
  }
  sdk=true;
  const ctx=cast.framework.CastContext.getInstance();
  ctx.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  player=new cast.framework.RemotePlayer(); ctrl=new cast.framework.RemotePlayerController(player);
  ctrl.addEventListener(cast.framework.RemotePlayerEventType.ANY_CHANGE,sync);
};

setTimeout(()=>{if(!sdkChecked&&canRemote())setStatus('Using your browser’s built-in casting. Find a video, then tap Cast to TV.')},3000);
$('#prev').remote?.addEventListener('connect',()=>setStatus('Casting. Use the video controls to play, pause and scrub.'));
$('#prev').remote?.addEventListener('disconnect',()=>setStatus('Stopped casting.'));

$('#cast').onclick=async()=>{
  if(!sdk){
    const v=$('#prev');
    if(!v.remote){setStatus('This browser can’t cast. Use Chrome on Android or desktop.',true);return}
    try{
      await v.remote.prompt();
      setStatus('Casting. Use the video controls above to play, pause and scrub.');
    }catch(e){
      if(e.name==='NotFoundError') setStatus('No Chromecast found. Make sure your phone and TV are on the same Wi-Fi.',true);
      else if(e.name!=='NotAllowedError') setStatus('Couldn’t start casting ('+e.name+').',true);
    }
    return;
  }
  const ctx=cast.framework.CastContext.getInstance();
  try{
    let s=ctx.getCurrentSession();
    if(!s){await ctx.requestSession(); s=ctx.getCurrentSession()}
    const f=chosen();
    const info=new chrome.cast.media.MediaInfo(f.url,f.mime);
    info.metadata=new chrome.cast.media.GenericMediaMetadata();
    info.metadata.title=current.title;
    if(current.thumb) info.metadata.images=[new chrome.cast.Image(current.thumb)];
    const req=new chrome.cast.media.LoadRequest(info); req.autoplay=true;
    $('#prev').pause();
    await s.loadMedia(req);
    setStatus('Casting to '+s.getCastDevice().friendlyName+'.');
  }catch(e){
    if(e==='cancel') return;
    setStatus('Couldn’t start casting ('+(e.code||e.message||e)+'). Make sure the TV and this device are on the same Wi-Fi.',true);
  }
};

const fmt=t=>{t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0')};
let dragging=false;
function sync(){
  const on=player.isConnected&&player.mediaInfo;
  $('#bar').hidden=!on; if(!on) return;
  $('#bt').textContent=player.title||current?.title||'';
  $('#pp').textContent=player.isPaused?'Play':'Pause';
  const can=player.canSeek&&player.duration>0;
  ['#seek','#back','#fwd'].forEach(id=>$(id).disabled=!can);
  $('#dur').textContent=player.duration?fmt(player.duration):'Live';
  if(!dragging){
    $('#seek').value=player.duration?player.currentTime/player.duration*1000:0;
    $('#cur').textContent=fmt(player.currentTime);
  }
  $('#vol').value=player.volumeLevel;
}
function seekTo(t){player.currentTime=Math.max(0,Math.min(t,player.duration||t));ctrl.seek()}
$('#pp').onclick=()=>ctrl.playOrPause();
$('#back').onclick=()=>seekTo(player.currentTime-10);
$('#fwd').onclick=()=>seekTo(player.currentTime+10);
$('#seek').oninput=e=>{dragging=true;$('#cur').textContent=fmt(e.target.value/1000*player.duration)};
$('#seek').onchange=e=>{seekTo(e.target.value/1000*player.duration);dragging=false};
$('#vol').oninput=e=>{player.volumeLevel=+e.target.value;ctrl.setVolumeLevel()};
$('#stop').onclick=()=>{ctrl.stop();cast.framework.CastContext.getInstance().endCurrentSession(true);$('#bar').hidden=true;setStatus('Stopped.')};
// Keep the controls fresh while the video plays
setInterval(()=>{if(player&&player.isConnected&&player.mediaInfo&&!dragging)sync()},500);
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
